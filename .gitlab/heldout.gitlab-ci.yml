# Held-out regression run (scaffolded by the heldout-evaluator skill: heldout init --ci gitlab).
#
# Re-runs an already-evaluated story's held-out suite (e.g. after a deploy) and re-renders the verdict.
# Failures whose signature matches a decision already confirmed by the evaluator carry over.
# Any NEW failure stays unconfirmed, so the verdict becomes INCONCLUSIVE (exit code 2): run the
# heldout-evaluator skill in your agent app to investigate it. CI never classifies a new defect by itself.
#
# Start it from Build → Pipelines → Run pipeline with the variable HELDOUT_KEY=ABC-123 (optionally
# AUT_BASE_URL to point at another environment), or from a schedule or pipeline trigger that sets HELDOUT_KEY.
# Secrets: every ${env:NAME} in test-data.json or the profile's accounts is a masked CI/CD variable of that name
# (they win over .env). For ${vault:path#field} references, give the job VAULT_ADDR and a token: VAULT_TOKEN (e.g. from
# GitLab's id_tokens + Vault JWT login), or VAULT_ROLE_ID + VAULT_SECRET_ID for AppRole; `heldout run` reads Vault itself.

heldout:
  image: node:22-bookworm
  rules:
    - if: $HELDOUT_KEY
  timeout: 30m
  variables:
    JIRA_MODE: mock
    npm_config_cache: $CI_PROJECT_DIR/.npm
  cache:
    key: heldout-npm
    paths: [.npm/]
  script:
    - npm ci
    - npx playwright install --with-deps chromium
    - npm run heldout -- run "$HELDOUT_KEY" --label ci
    - npm run heldout -- triage "$HELDOUT_KEY" --carry-from auto
    - npm run heldout -- verdict "$HELDOUT_KEY" --exit-code
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - output/*/$HELDOUT_KEY/verdict.md
      - output/*/$HELDOUT_KEY/verdict.json
      - output/*/$HELDOUT_KEY/runs/
    reports:
      junit: output/*/$HELDOUT_KEY/runs/*/junit.xml
