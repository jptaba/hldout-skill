# url: https://the-internet.herokuapp.com/tables
# step: Then its rows are sorted by last name, ascending
- link "Fork me on GitHub":
  - /url: https://github.com/tourdedave/the-internet
  - img "Fork me on GitHub"
- heading "Data Tables" [level=3]
- paragraph: Often times when you see a table it contains data which is sortable -- sometimes with actions that can be taken within each row (e.g. edit, delete). And it can be challenging to automate interaction with sets of data in a table depending on how it is constructed.
- heading "Example 1" [level=4]
- paragraph: No Class or ID attributes to signify groupings of rows and columns
- table:
  - rowgroup:
    - row "Last Name First Name Email Due Web Site Action":
      - columnheader "Last Name"
      - columnheader "First Name"
      - columnheader "Email"
      - columnheader "Due"
      - columnheader "Web Site"
      - columnheader "Action"
  - rowgroup:
    - row "Bach Frank fbach@yahoo.com $51.00 http://www.frank.com edit delete":
      - cell "Bach"
      - cell "Frank"
      - cell "fbach@yahoo.com"
      - cell "$51.00"
      - cell "http://www.frank.com"
      - cell "edit delete":
        - link "edit":
          - /url: "#edit"
        - link "delete":
          - /url: "#delete"
    - row "Conway Tim tconway@earthlink.net $50.00 http://www.timconway.com edit delete":
      - cell "Conway"
      - cell "Tim"
      - cell "tconway@earthlink.net"
      - cell "$50.00"
      - cell "http://www.timconway.com"
      - cell "edit delete":
        - link "edit":
          - /url: "#edit"
        - link "delete":
          - /url: "#delete"
